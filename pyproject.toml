[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long — formatter handles this, don't double-flag
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true  #allow for LangChain's incomplete type stubs
disallow_untyped_defs = false
warn_return_any = false